name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -----------------------------------------------------------
  # 1. Тестирование и валидация Backend
  # -----------------------------------------------------------
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          # Проверка синтаксиса и критических ошибок без остановки на минорных предупреждениях
          ruff check backend/app --select=E9,F63,F7,F82

      - name: Run Pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/tests/

  # -----------------------------------------------------------
  # 2. Валидация сборки Frontend
  # -----------------------------------------------------------
  frontend-checks:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install npm dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Compile production bundle
        working-directory: ./frontend
        run: npm run build

  # -----------------------------------------------------------
  # 3. Валидация сборки Docker Compose
  # -----------------------------------------------------------
  docker-build:
    name: Docker Compose Build Test
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build containers via Docker Compose
        run: |
          docker compose build --parallel
